name: Docker build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image
        run: |
          export DOCKER_BUILDKIT=1
          docker buildx build --progress=plain --load -t v2bx:test .

      - name: Smoke test image
        run: |
          docker run --rm v2bx:test --help || \
            docker run --rm --entrypoint sh v2bx:test -lc '
              if command -v V2bX >/dev/null 2>&1; then
                V2bX --help;
              elif command -v v2bx >/dev/null 2>&1; then
                v2bx --help;
              else
                ls -al /
                exit 1
              fi
            '
