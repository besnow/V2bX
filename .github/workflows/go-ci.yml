name: Go CI

on:
  push:
    branches: [dev_new]
  pull_request:
    branches: [dev_new]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Format
        run: gofmt -w ./...

      - name: Test
        run: go test ./...
        env:
          GODEBUG: fips140=off

      - name: Build
        run: go build ./...
        env:
          GODEBUG: fips140=off
